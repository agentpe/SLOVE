# ===========================================================================
# STOCK VOICE VARIATIONS AND THE NPC POOL
# ===========================================================================
# Female voicepacks are OPTIONAL, so a default install has none - and the two
# stock voices above would then have the whole female cast sharing F0, because
# the NPC pool ids F2-F10 are pack-provided and AudioUtil drops ids nothing
# declares. SexLab ships EIGHT female moan voices (vFemaleMoan01-08) and SLO VE
# was using two, so the rest are declared below as F0v2-F0v8 and the pool ids
# are stubbed onto them round-robin.
#
# This mirrors what the male side already does in SLOVE_male.toml, where M1-M8
# each name a different stock slot (M0/M0B/M0C/M0D = vMaleMoan01-04).
#
# A PACK IS INSTALLED: its SLOVE_zpack_*.toml sorts last and replaces the whole
# pool id - its path, its categories, its gag_slot and its own `fallback`. The
# stubs only fill the ids no pack claimed, so installing or removing a pack
# needs no edit here. A pack that wants one of these voices under it names it:
# fallback = "F0v4" instead of F0B.
#
# These are stock SexLab assets - loose PCM wav, so lipsync works on them
# exactly like F0 / F0B. Sound replacers swap the files in place, so this picks
# up whatever replacer is installed.
# Same category map as F0 / F0B in SLOVE_voices.toml, pointed at a different
# voice folder. Reached only as another slot's `fallback`, never by actor
# routing, so they never steal an actor from a spoken pack.
# ===========================================================================

