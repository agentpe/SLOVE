# AudioUtil overlay - SLO VE: every FEMALE voice slot (additive content).
#
# One of SLO VE's four AudioUtil overlays, split by what they hold:
#   SLOVE_creatures.toml  creature slots C0-C41 + the race hints routing them
#   SLOVE_female.toml     THIS FILE - female slots
#   SLOVE_male.toml       male slots
#   SLOVE_voices.toml     actor->slot routing, category maps, groups, SFX slot
# They merge in sorted filename order (c < f < m < v), then any voicepack's
# SLOVE_zpack_*.toml last. No slot id is shared between them, so the split is
# purely additive and the order among these four does not matter.
#
# Slots are keyed by id: if a later file defines the same id it replaces the
# WHOLE slot, no per-category merge. That is how a voicepack claims a pool id.
#
# A slot is built from any mix of:
#   - a scanned folder tree (path = 'Sound\fx\SLOVE\<Id>' holding
#     <Category>\*.wav subfolders),
#   - explicit per-category FILE lists ([slot.categories] array values), which
#     need no loose files and may point into BSA archives,
#   - per-category FOLDER references ([slot.categories] string values,
#     'Sound\...' = full Data path, else relative to the slot's path; loose
#     files only) - the F0 / F0B / F0v* SexLab-moan slots below.
# Explicit categories win over same-named scanned folders. Every slot names its
# own full `path`, so this preset never depends on a shared voice_root global.
#
# Categories a slot does not list resolve via [category_aliases.female] /
# [category_fallbacks.female] (SLOVE_voices.toml). Audit any slot in-game:
# SLOVE_Test AuditVoicePack F1.

# ===========================================================================
# THE PC SLOT AND THE STOCK VOICES
# F1  = the PLAYER pack slot (pc_female_slot in the base AudioUtil.toml): scans
#       Sound\fx\SLOVE\F1 - drop ANY Hentairim-convention female pack there and
#       it just plays, no config edits. Categories the pack lacks (or the whole
#       slot, when no pack is installed) backfill per-category from F0.
# F0  = the stock DEFAULT female voice (default_female_slot): SexLab's own moan
#       set - loose files every SexLab install already has, nothing bundled,
#       plain PCM so lipsync works - mapped per category by intensity.
# F0B = a second stock voice, the classic backfill for the NPC pool slots.
# The NPC pool F2-F10 and the extra stock voices F0v2-F0v8 follow further down.
# ===========================================================================

[[slot]]  # player pack slot - any female pack dropped here wins per category
id = "F1"
sex = "female"
path = 'Sound\fx\SLOVE\F1'
fallback = "F0"
gag_slot = "F1gag"    # muffled DD-gag voice when the actor wears a gag (see [gag])

# ---- NPC voice-pool slots (F2-F10) ----
# Female NPCs in scenes spread across these nine ids via the female
# [voicetype_map] entries in SLOVE_voices.toml. They are declared at the BOTTOM
# of this file as stubs (an empty pack folder + a stock voice as fallback), so a
# pack-less install already has nine live, distinct voices. A voicepack claims an
# id by redefining it in its own config\*.toml overlay: slots are keyed by id and
# the last file in sorted filename order wins the whole slot, which is why packs
# ship as SLOVE_zpack_<Name>.toml. Template a pack overlay copies:
#   [[slot]]
#   id = "F2"                        # any pool id F2..F10 (pick a free one)
#   sex = "female"
#   path = 'Sound\fx\SLOVE\<Pack>'   # the pack's own unique audio folder
#   fallback = "F0B"                 # stock moans for categories the pack lacks
#                                    # (or F0v2..F0v8 for a specific stock voice)
#   gag_slot = "F1gag"               # shared muffled gag pool
#   # variation = "B"                # only if the pack uses the partitioned layout

[[slot]]  # gagged-female voice. Gagged speakers route here via gag_slot. F1gag has
          # NO fallback and only a GagMoan\ folder, so every requested category
          # misses here and the [gag] default_category "GagMoan" (AudioUtil.toml)
          # takes over - playing the muffled gag moans below (~27 atm_*/flat_* clips)
          # for EVERY gagged line, regardless of pack or variation. Never F0's clear
          # stock moans, never the pack's spoken line. Do NOT add fallback = "F0"
          # here: F0 lists nearly every category, so the requested category would
          # resolve to a clear stock moan and GagMoan would never play. (To override
          # a single beat, drop a pack-specific muffled clip in as a named category
          # folder here.)
id = "F1gag"
sex = "female"
path = 'Sound\fx\SLOVE\F1gag'

