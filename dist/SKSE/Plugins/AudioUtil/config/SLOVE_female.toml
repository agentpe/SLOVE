# ===========================================================================
# NPC VOICE-POOL STUBS - what actually spreads the variation
# ===========================================================================
# Each pool id points at its own (normally absent) pack folder and names a stock
# voice as its fallback. Nothing resolves IN the slot, so every category falls
# straight through to that voice - resolution walks slot -> fallback with a
# 4-hop cap, so F<n> -> F0v<n> -> F0B still has room.
#
# The `path` is REQUIRED, not decoration: AudioUtil skips any [[slot]] that has
# neither a path nor [slot.categories] ("Skipping [[slot]] entry with missing
# id, or neither path nor categories"), and a skipped slot never joins the
# [voicetype_map] spread. It doubles as the drop-in folder for this pool id -
# put loose <Category>\*.wav in it and the id becomes a real pack, with the
# stock voice below still backfilling whatever it lacks.
#
# On a default install these folders do not exist, so the load log carries one
# benign "Slot F<n>: folder not found" per id - the same line an unfilled F1
# (no PC pack) already produces. Routing is unaffected.
#
# `gag_slot` is read off the slot the ACTOR resolved to, not off the fallback,
# so each stub names F1gag itself - otherwise a gagged NPC on a stub would moan
# clear stock audio straight through her gag.
#
# These are the DEFAULT-INSTALL voices. A voicepack overlay claiming the same id
# replaces the stub outright and brings its own fallback, so there is nothing to
# uninstall or edit here when a pack goes in. Comment the block out only if you
# want pack-less female NPCs back on the single shared F0 voice.

[[slot]]
id = "F2"
sex = "female"
path = 'Sound\fx\SLOVE\F2'
fallback = "F0v2"
gag_slot = "F1gag"

