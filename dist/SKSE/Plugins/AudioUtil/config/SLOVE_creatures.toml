# SLO VE - creature voice slots C11-C41 (species coverage beyond SLOVE_voices.toml)
#
# Additive AudioUtil overlay. SLOVE_voices.toml owns C0-C10 (werewolf, draugr,
# falmer, troll, giant, wolf, dog, chaurus, spriggan, horse) and the generic C0
# catch-all; this file extends the same scheme to another 31 species and adds the
# race hints that route them. No slot id and no race hint is shared between the
# two files, so the merge is purely additive - order does not matter.
#
# Every slot is built the same way as C0-C10: vanilla (or More Nasty Critters)
# sound files named as an explicit file list, because folder SCANS cannot see
# BSA-packed audio - only an explicit list resolves through the engine's loader.
#
# DEPENDENCY: the fox (C19) and dragon (C28) slots are sourced ENTIRELY from
# More Nasty Critters, and the lurker (C23) and hagraven (C27) slots mostly so.
# Without MNC installed those categories resolve nothing - which is why every
# slot here carries fallback = "C0", so a missing file degrades to the generic
# creature growls instead of to silence.

