# ---------- SFX: the SFX0 slot ----------
# Body SFX are a slot like everything else (uniform with the voice packs above):
# PlaySFX(name) resolves `name` as a category of the sfx slot (id "SFX0", set by
# AudioUtil's [general] sfx_slot) before the flat [sfx] table. sex = "all" =
# sex-neutral. Categories are folder refs (full 'Sound\...' paths, case-
# insensitive); a category could equally be an explicit file list to pull SFX
# from a BSA. Driven by the SLOVE_SFX body-SFX engine (toggle/tune it in
# SKSE\Plugins\SLOVE\SLOVE.toml [sfx]). All playable via PlaySFX. Note: the voice
# engine also requests PullOutGape (on penetration-start) through the VOICE path,
# which resolves it via the female slots' fallback chain (F1->F0, F2/F3->F0B, where
# PullOutGape is a category ref) - AudioUtil has no voice->SFX last-resort, so the
# SFX0 entry below serves PlaySFX only, not the voice call.
